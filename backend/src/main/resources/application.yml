spring:
  application:
    name: argos-backend
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/argos}
    username: ${DB_USER:argos}
    password: ${DB_PASSWORD:argos_dev_only}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

argos:
  security:
    jwt:
      # Obrigatório via ambiente (mínimo 32 caracteres). Sem default de propósito.
      secret: ${JWT_SECRET}
      issuer: argos
      access-ttl-seconds: 900
      refresh-ttl-seconds: 604800
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    login:
      max-failed-attempts: 5
      lock-minutes: 15

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
